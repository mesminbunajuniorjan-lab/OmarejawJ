kind = "web"
previewPath = "/"
title = "McDonald's Investment App"
version = "1.0.0"
id = "artifacts/mcdo-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23146

[services.development]
run = "pnpm --filter @workspace/mcdo-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mcdo-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/mcdo-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23146"
BASE_PATH = "/"
